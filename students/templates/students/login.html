<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
    </head>
    <body>
        <form method="post">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" name="username">
            <br>
            <br>
            <label for="password">Password:</label>
            <input type="password" name="password">
            <br><br>
            <button type="submit">Login</button>
        </form>
    </body>
</html>
